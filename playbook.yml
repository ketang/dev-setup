- name: Provision development environment
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - vars/main.yml

  roles:
    - base
    - homebrew
    - docker
    - earlyoom
    - golang
    - rust
    - nodejs
    - python
    - postgresql
    - playwright
    - ssh
    - github-cli
    - netbird
    - project-tools
    - user
